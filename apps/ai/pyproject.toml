[project]
name = "khmerdub-ai"
version = "0.1.0"
description = "KhmerDub AI - media processing and AI inference service (FastAPI + Celery)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic-settings>=2.4",
    "celery[redis]>=5.5",
    "httpx>=0.27",
    # kombu's Redis transport imports `packaging` but does not declare it (kombu 5.7.0).
    "packaging>=24",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["khmerdub_ai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
