khmerdub:
  internal-token: test-internal-token-0123456789abcdef0123456789
  storage-root: target/test-storage
  # Small enough that the test machine always has "enough" free space; disk guard is tested separately.
  min-free-disk-gb: 1
  ai-service:
    # Nothing listens here: the AI service is deliberately unreachable in these tests.
    url: http://127.0.0.1:1
    connect-timeout: 1s
    read-timeout: 1s
  health-broadcast-interval-ms: 3600000
  jobs:
    # Tests drive the engine step by step instead of relying on timers.
    scheduler-enabled: false
